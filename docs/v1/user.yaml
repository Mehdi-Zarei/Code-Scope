paths:
  /users:
    get:
      summary: دریافت لیست کاربران
      description: این مسیر فقط برای ادمین‌ها قابل دسترسی است و لیستی از کاربران سیستم را برمی‌گرداند.
      tags:
        - Users (Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            minimum: 1
          description: تعداد آیتم‌ها در هر صفحه
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: شماره صفحه
      responses:
        200:
          description: لیست کاربران با موفقیت دریافت شد.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        400:
          description: خطا در اعتبارسنجی اطلاعات
        401:
          description: نیاز به احراز هویت
        403:
          description: دسترسی غیرمجاز

  /users/role/{id}:
    patch:
      summary: تغییر نقش کاربر
      description: فقط ادمین‌ها می‌توانند نقش کاربر را به ADMIN، USER یا AUTHOR تغییر دهند.
      tags:
        - Users (Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: شناسه کاربر (ObjectId)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                newRole:
                  type: string
                  enum:
                    - ADMIN
                    - USER
                    - AUTHOR
              required:
                - newRole
      responses:
        200:
          description: نقش کاربر با موفقیت تغییر یافت.
        400:
          description: خطا در داده‌های ارسالی
        404:
          description: کاربر یافت نشد
        409:
          description: شناسه نامعتبر

  /users/restrict/{id}:
    patch:
      summary: مسدود یا آزاد کردن دسترسی کاربر
      description: ادمین می‌تواند دسترسی کاربر را مسدود یا آزاد کند (toggle).
      tags:
        - Users (Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: شناسه کاربر (ObjectId)
      responses:
        200:
          description: وضعیت محدودیت با موفقیت تغییر کرد.
        404:
          description: کاربر یافت نشد
        409:
          description: شناسه نامعتبر

  /users/me:
    get:
      summary: دریافت اطلاعات کاربر لاگین‌شده
      description: اطلاعات حساب کاربری لاگین‌شده را برمی‌گرداند.
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        200:
          description: اطلاعات کاربر با موفقیت دریافت شد.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        401:
          description: نیاز به احراز هویت

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [ADMIN, USER, AUTHOR]
        isRestrict:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - _id
        - name
        - email
        - role

    Pagination:
      type: object
      properties:
        totalItems:
          type: integer
        totalPages:
          type: integer
        currentPage:
          type: integer
        perPage:
          type: integer
        resource:
          type: string
